<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Police Chase Drifter</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<div id="c2canvasdiv">
    <canvas id="c2canvas" width="854" height="480"></canvas>
</div>

<!-- REQUIRED FILES -->
<script src="jquery-3.4.1.min.js"></script>
<script src="pathfind.js"></script>
<script src="c2runtime.js"></script>

<script>
    jQuery(document).ready(function () {
        cr_createRuntime("c2canvas");
    });
</script>

<script>
  /* Keep the game from blocking on ads */
  window.adRunning = 0;
  window.adRunningRewarded = 0;
  window.adReward = 1;   // treat rewards as granted
  window.rewardError = 0;
  window.canReward = 1;

  /* No-op the common entry points */
  window.ExternEval = function(){};
  window.ExternEvalResumeGame = function(){};
  window.ShowRewarded = function(){};
  window.PreloadRewarded = function(){};
  window.RewardedReady = function(){ window.canReward = 1; };
  window.RewardedSuccess = function(){ window.adReward = 1; };
  window.RewardedFail = function(){};

  /* Fake a loader object so calls don’t throw */
  window.preroll = { config: { loaderObjectName: "fakeAdLoader" } };
  window.fakeAdLoader = {
    refetchAd: (cb)=>{ if (cb) cb(); },
    showRewardAd: ()=>{},
    registerRewardCallbacks: ()=>{}
  };
</script>

<div id="credit">Ported by Epix Unblocked</div>

<style>
    #credit {
        position: fixed;
        bottom: 8px;
        right: 10px;
        font-family: Arial, sans-serif;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
        z-index: 9999;
        pointer-events: none;
    }
</style>
</body>
</html>
